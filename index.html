<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Stream & Chat Hub</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header & Language Selector -->
    <header class="bg-cardbg border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <h1 id="app-title" class="text-xl font-bold text-indigo-400">P2P Stream & Chat</h1>
        <div class="flex items-center space-x-4">
            <select id="lang-select" class="bg-slate-800 border border-slate-600 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="te">తెలుగు (Telugu)</option>
            </select>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- Video & Connection Section -->
        <section class="lg:col-span-2 flex flex-col space-y-4">
            <!-- Connection Card -->
            <div class="bg-cardbg p-4 rounded-xl border border-slate-700 shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="text-sm">
                    <span id="label-my-id" class="text-slate-400">Your ID:</span> 
                    <span id="my-peer-id" class="font-mono font-bold text-indigo-300">Generating...</span>
                </div>
                <div class="flex items-center space-x-2 w-full sm:w-auto">
                    <input type="text" id="peer-id-input" placeholder="Enter Peer ID" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 flex-1 sm:w-48">
                    <button id="btn-connect" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Connect</button>
                </div>
            </div>

            <!-- Video Grid Container -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1">
                <div class="bg-cardbg border border-slate-700 rounded-xl overflow-hidden relative aspect-video flex items-center justify-center shadow-inner">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                    <span class="absolute bottom-3 left-3 bg-black/60 text-xs px-2 py-1 rounded backdrop-blur-sm" data-translate="localStream">Local Stream</span>
                </div>
                <div class="bg-cardbg border border-slate-700 rounded-xl overflow-hidden relative aspect-video flex items-center justify-center shadow-inner">
                    <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                    <span class="absolute bottom-3 left-3 bg-black/60 text-xs px-2 py-1 rounded backdrop-blur-sm" data-translate="remoteStream">Remote Stream</span>
                </div>
            </div>

            <!-- Call Controls -->
            <div class="flex justify-center space-x-4 pt-2">
                <button id="btn-start-call" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl font-medium shadow-lg transition flex items-center space-x-2">
                    <span data-translate="startCall">Start Call</span>
                </button>
                <button id="btn-end-call" class="bg-rose-600 hover:bg-rose-500 text-white px-6 py-2.5 rounded-xl font-medium shadow-lg transition hidden flex items-center space-x-2">
                    <span data-translate="endCall">End Call</span>
                </button>
            </div>
        </section>

        <!-- Chat Section -->
        <section class="bg-cardbg border border-slate-700 rounded-xl shadow-lg flex flex-col h-[500px] lg:h-auto">
            <div class="p-4 border-b border-slate-700 font-semibold text-slate-200" data-translate="chatHeader">Peer Chat</div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm flex flex-col">
                <div class="text-center text-slate-500 italic text-xs my-auto" data-translate="chatWelcome">Messages will appear here...</div>
            </div>
            <div class="p-3 border-t border-slate-700 flex space-x-2">
                <input type="text" id="chat-input" placeholder="Type a message..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 flex-1">
                <button id="btn-send-chat" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition" data-translate="sendBtn">Send</button>
            </div>
        </section>

    </main>

    <!-- Application Script -->
    <script>
        // Multi-language dictionary
        const translations = {
            en: {
                appTitle: "P2P Stream & Chat",
                myId: "Your ID:",
                connect: "Connect",
                localStream: "Local Stream",
                remoteStream: "Remote Stream",
                startCall: "Start Call",
                endCall: "End Call",
                chatHeader: "Peer Chat",
                chatWelcome: "Messages will appear here...",
                sendBtn: "Send",
                typeMsg: "Type a message..."
            },
            hi: {
                appTitle: "पी2पी स्ट्रीम और चैट",
                myId: "आपकी आईडी:",
                connect: "कनेक्ट करें",
                localStream: "स्थानीय स्ट्रीम",
                remoteStream: "रिमोट स्ट्रीम",
                startCall: "कॉल शुरू करें",
                endCall: "कॉल समाप्त करें",
                chatHeader: "पीयर चैट",
                chatWelcome: "संदेश यहाँ दिखाई देंगे...",
                sendBtn: "भेجें",
                typeMsg: "संदेश लिखें..."
            },
            te: {
                appTitle: "P2P స్ట్రీమ్ & చాట్",
                myId: "మీ ID:",
                connect: "కనెక్ట్ చేయండి",
                localStream: "స్థానిక స్ట్రీమ్",
                remoteStream: "రిమోట్ స్ట్రీమ్",
                startCall: "కాల్ ప్రారంభించండి",
                endCall: "కాల్ ముగించు",
                chatHeader: "పీర్ చాట్",
                chatWelcome: "संदेश यहाँ दिखाई देंगे...",
                sendBtn: "పంపు",
                typeMsg: "संदेश लिखें..."
            }
        };

        // Language toggle implementation
        const langSelect = document.getElementById('lang-select');
        langSelect.addEventListener('change', (e) => {
            const lang = e.target.value;
            const dict = translations[lang];
            
            document.getElementById('app-title').textContent = dict.appTitle;
            document.getElementById('label-my-id').textContent = dict.myId;
            document.getElementById('btn-connect').textContent = dict.connect;
            document.getElementById('btn-start-call').querySelector('span').textContent = dict.startCall;
            document.getElementById('btn-end-call').querySelector('span').textContent = dict.endCall;
            document.querySelector('section.bg-cardbg .font-semibold').textContent = dict.chatHeader;
            document.getElementById('btn-send-chat').textContent = dict.sendBtn;
            document.getElementById('chat-input').placeholder = dict.typeMsg;
        });

        // WebRTC / PeerJS Core Setup
        let localStream;
        let activeConnection;
        let activeCall;

        const peer = new Peer();

        peer.on('open', (id) => {
            document.getElementById('my-peer-id').textContent = id;
        });

        // Get local media stream
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                document.getElementById('local-video').srcObject = stream;
            })
            .catch((err) => {
                console.error("Media permission denied or unavailable:", err);
            });

        // Handle incoming calls
        peer.on('call', (call) => {
            call.answer(localStream);
            activeCall = call;
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                toggleCallButtons(true);
            });
        });

        // Handle incoming data connections (chat)
        peer.on('connection', (conn) => {
            activeConnection = conn;
            setupConnectionHandlers();
        });

        // Connect button action
        document.getElementById('btn-connect').addEventListener('click', () => {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            if (!remoteId) return;

            activeConnection = peer.connect(remoteId);
            setupConnectionHandlers();
        });

        // Start call button action
        document.getElementById('btn-start-call').addEventListener('click', () => {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            if (!remoteId || !localStream) return;

            const call = peer.call(remoteId, localStream);
            activeCall = call;
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                toggleCallButtons(true);
            });
        });

        // End call action
        document.getElementById('btn-end-call').addEventListener('click', () => {
            if (activeCall) activeCall.close();
            document.getElementById('remote-video').srcObject = null;
            toggleCallButtons(false);
        });

        function toggleCallButtons(inCall) {
            const startBtn = document.getElementById('btn-start-call');
            const endBtn = document.getElementById('btn-end-call');
            if (inCall) {
                startBtn.classList.add('hidden');
                endBtn.classList.remove('hidden');
            } else {
                startBtn.classList.remove('hidden');
                endBtn.classList.add('hidden');
            }
        }

        // Chat Handlers
        function setupConnectionHandlers() {
            activeConnection.on('data', (data) => {
                appendMessage('Peer', data, 'bg-slate-700 text-slate-100');
            });
        }

        document.getElementById('btn-send-chat').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            if (activeConnection && activeConnection.open) {
                activeConnection.send(message);
            }
            appendMessage('You', message, 'bg-indigo-600 text-white ml-auto');
            input.value = '';
        }

        function appendMessage(sender, text, styling) {
            const chatBox = document.getElementById('chat-messages');
            // Remove welcome placeholder if present
            if (chatBox.children.length === 1 && chatBox.children[0].classList.contains('italic')) {
                chatBox.innerHTML = '';
            }
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-2.5 rounded-lg max-w-[80%] break-words ${styling}`;
            msgDiv.innerHTML = `<span class="text-xs opacity-75 block font-semibold">${sender}</span>${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
