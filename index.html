        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose Firebase services globally for non-module handlers
        window.fbApp = app;
        window.fbAuth = auth;
        window.fbDb = db;
        window.fbAppId = appId;
        window.fbDoc = doc;
        window.fbSetDoc = setDoc;

        window.fbUpdateDoc = updateDoc;
        window.fbOnSnapshot = onSnapshot;
        window.fbCollection = collection;
        window.fbQuery = query;
        window.fbCreateUser = createUserWithEmailAndPassword;
        window.fbSignIn = signInWithEmailAndPassword;
        window.fbSignOut = signOut;
        window.fbOnAuth = onAuthStateChanged;
    </script>

        // Firebase Sync Helpers
        async function syncUserProfileToFirebase() {
            if (!window.fbAuth?.currentUser || !myPeerId) return;
            const uid = window.fbAuth.currentUser.uid;
            const userRef = window.fbDoc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'users', uid);
            
            const payload = {
                uid: uid,
                email: window.fbAuth.currentUser.email,
                username: currentUserProfile?.username || window.fbAuth.currentUser.email.split('@')[0],
                peerId: myPeerId,
                status: 'online',
                lastActive: new Date().toISOString()
            };

            await window.fbSetDoc(userRef, payload, { merge: true });
        }

        function initFirebaseListeners() {
            if (!window.fbAuth) return;

            window.fbOnAuth(window.fbAuth, async (user) => {
                if (user) {
                    const userRef = window.fbDoc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'users', user.uid);
                    const snap = await window.fbGetDoc(userRef);
                    
                    if (snap.exists()) {
                        currentUserProfile = snap.data();
                    } else {
                        currentUserProfile = {
                            username: user.email.split('@')[0],
                            email: user.email,
                            peerId: myPeerId || ''
                        };
                    }

                    document.getElementById('user-display-name').innerText = currentUserProfile.username;
                    document.getElementById('user-display-email').innerText = user.email;

                    await syncUserProfileToFirebase();
                    listenToMembersList();
                    listenToIncomingConnectionRequests(user.uid);
                } else {
                    document.getElementById('user-display-name').innerText = "Guest User";
                    document.getElementById('user-display-email').innerText = "Not Logged In";
                    document.getElementById('members-list-container').innerHTML = '<div class="text-slate-500 text-center py-6 text-xs">Log in to view available members</div>';
                }
            });
        }

        function listenToMembersList() {
            const usersColl = window.fbCollection(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'users');
            window.fbOnSnapshot(usersColl, (snapshot) => {
                const container = document.getElementById('members-list-container');
                container.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.uid === window.fbAuth?.currentUser?.uid) return;

                    const card = document.createElement('div');
                    card.className = "p-2.5 rounded-xl bg-slate-200 dark:bg-slate-900 border dynamic-border flex items-center justify-between gap-2";
                    card.innerHTML = `
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full ${data.status === 'online' ? 'bg-emerald-400' : 'bg-slate-500'}"></span>
                                <span class="font-bold text-slate-800 dark:text-slate-200 truncate">${data.username || 'Peer'}</span>
                            </div>
                            <div class="text-[10px] text-slate-500 truncate font-mono">ID: ${data.peerId || 'Offline'}</div>
                        </div>
                        <button onclick="requestConnectionToPeer('${data.peerId}', '${data.username}')" class="px-2.5 py-1.5 rounded-lg dynamic-bg-primary dynamic-bg-hover text-white text-[10px] font-bold transition shrink-0">
                            Connect
                        </button>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('members-loading-icon').classList.add('hidden');
            }, (err) => {
                console.error("Firestore snapshot error:", err);
            });
        }

        function listenToIncomingConnectionRequests(currentUid) {
            const reqRef = window.fbDoc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'requests', currentUid);
            window.fbOnSnapshot(reqRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.status === 'pending') {
                        document.getElementById('request-sender-label').innerText = `${data.senderUsername || 'User'} (ID: ${data.senderPeerId}) wants to connect.`;
                        document.getElementById('request-modal').classList.remove('hidden');
                        window.activeIncomingRequest = data;
                    }
                }
            });
        }

        window.requestConnectionToPeer = async function(peerId, username) {
            if (!peerId) { alert("Peer is offline or has no Peer ID."); return; }
            document.getElementById('target-peer-id').value = peerId;
            
            if (!window.fbAuth?.currentUser) {
                alert("Please log in first to send connection requests.");
                document.getElementById('auth-modal').classList.remove('hidden');
                return;
            }

            const reqRef = window.fbDoc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'requests', peerId);
            await window.fbSetDoc(reqRef, {
                senderUid: window.fbAuth.currentUser.uid,
                senderUsername: currentUserProfile?.username || 'Peer',
                senderPeerId: myPeerId,
                targetPeerId: peerId,
                status: 'pending',
                timestamp: new Date().toISOString()
            });

            setConnectionStatus(`Request sent to ${username || peerId}. Awaiting response...`, 'text-cyan-400');

            // Listen for acceptance
            const mySentReqRef = window.fbDoc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'requests', peerId);
            window.fbOnSnapshot(mySentReqRef, (snap) => {
                if (snap.exists() && snap.data().status === 'accepted') {
                    unlockCallingControls();
                    setConnectionStatus(`Connected with ${username}! Call controls unlocked.`, 'text-emerald-400');
                }
            });
        };

            isConnectionAccepted = true;
            const controlsGroup = document.getElementById('call-controls-group');

            controlsGroup.classList.remove('opacity-50', 'pointer-events-none');
            chatBtn.classList.remove('opacity-50', 'pointer-events-none');
            chatBtn.removeAttribute('disabled');
        }
