<!DOCTYPE html>
<html lang="en" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONNECT - Unified Call & Chat Suite</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        theme: {
                            primary: 'var(--color-primary)',
                            hover: 'var(--color-hover)',
                            border: 'var(--color-border)',
                            text: 'var(--color-text)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- PeerJS CDN for WebRTC Video & Voice Calls -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --color-primary: #6366f1;
            --color-hover: #4f46e5;
            --color-border: rgba(99, 102, 241, 0.3);
            --color-text: #818cf8;
            --app-font: 'Inter', sans-serif;
        }

        body {
            font-family: var(--app-font);
            background-color: #09090e;
            color: #f1f5f9;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }

        html.light body {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .font-display { font-family: 'Orbitron', sans-serif; }
        .font-code { font-family: 'Fira Code', monospace; }

        .glass-panel {
            background: rgba(15, 14, 38, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--color-border);
            transition: background 0.3s, border-color 0.3s;
        }

        html.light .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--color-border);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
        }

        .dynamic-bg-primary { background-color: var(--color-primary); }
        .dynamic-bg-hover:hover { background-color: var(--color-hover); }
        .dynamic-border { border-color: var(--color-border); }
        .dynamic-text { color: var(--color-text); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090e; }
        ::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 3px; }

        video {
            object-fit: cover;
            transform: scaleX(-1);
        }
        .no-mirror {
            transform: scaleX(1) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- TOP HEADER -->
    <header class="w-full border-b dynamic-border dark:bg-slate-950/80 bg-white/90 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl dynamic-bg-primary flex items-center justify-center shadow-lg text-white">
                    <i class="fa-solid fa-satellite-dish text-lg animate-pulse"></i>
                </div>
                <div>
                    <h1 class="font-display font-black text-xl md:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500">
                        CONNECT
                    </h1>
                </div>
            </div>

            <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-emerald-500/40 bg-emerald-950/20 text-emerald-500 text-xs font-mono">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
                <span class="font-bold text-emerald-400">ONLINE</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- LEFT COLUMN: CONTROLS & USER ID -->
        <section class="lg:col-span-3 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-3 flex items-center justify-between font-mono text-xs">
                <div class="truncate mr-2">
                    <div class="text-slate-400">User: <span id="display-user-handle" class="font-bold text-cyan-400">Guest</span></div>
                    <div class="text-slate-500">Your ID: <span id="my-peer-id" class="dynamic-text font-bold">Initializing...</span></div>
                </div>
                <button id="copy-id-btn" class="text-slate-400 hover:text-indigo-500 transition text-xs px-2 py-1 bg-slate-800 rounded">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <div class="glass-panel rounded-2xl p-3 space-y-3">
                <input id="target-peer-id" type="text" autocomplete="off" placeholder="Enter friend Peer ID" class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 text-xs text-slate-100 outline-none focus:border-indigo-400 font-mono">
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start-video" class="w-full rounded-lg dynamic-bg-primary dynamic-bg-hover py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5 shadow-md">
                        <i class="fa-solid fa-video"></i> Video Call
                    </button>
                    <button id="btn-start-voice" class="w-full rounded-lg bg-emerald-600 hover:bg-emerald-500 py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5 shadow-md">
                        <i class="fa-solid fa-phone"></i> Voice Call
                    </button>
                </div>

                <button id="btn-start-chat" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-comments"></i> Chat Session
                </button>

                <p id="connection-status" class="text-[11px] text-amber-300 font-mono">Initializing PeerJS...</p>
            </div>
        </section>

        <!-- CENTER COLUMN: MAIN CALL SCREEN -->
        <section class="lg:col-span-6 flex flex-col gap-4">
            <div class="relative glass-panel rounded-2xl overflow-hidden min-h-[380px] sm:min-h-[460px] flex items-center justify-center bg-slate-950">
                <video id="main-video" autoplay playsinline class="w-full h-full object-cover hidden no-mirror absolute inset-0"></video>
                
                <div id="remote-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-950/90 z-0">
                    <div class="w-20 h-20 rounded-full bg-slate-900 border dynamic-border flex items-center justify-center mb-4 dynamic-text animate-pulse shadow-lg">
                        <i class="fa-solid fa-user text-3xl"></i>
                    </div>
                    <h3 class="font-display font-bold text-base text-slate-200">READY TO CALL</h3>
                    <p class="text-xs text-slate-400 max-w-xs mt-1">Select an active member from the directory or enter their Peer ID to connect.</p>
                </div>

                <div id="pip-container" class="absolute bottom-16 right-4 w-32 h-44 rounded-xl overflow-hidden border-2 dynamic-border bg-slate-900 shadow-2xl z-20">
                    <video id="pip-video" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
                    <div id="pip-off-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 text-slate-400 text-center p-2">
                        <i class="fa-solid fa-user-slash text-xl mb-1 text-slate-500"></i>
                        <span class="text-[9px] font-mono leading-tight">Camera Off</span>
                    </div>
                </div>

                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-slate-950/85 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-2xl z-30 shadow-2xl">
                    <button id="btn-end-call" class="w-10 h-10 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center text-sm transition shadow-lg shadow-red-600/30">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- RIGHT COLUMN: CHAT & MEMBERS DIRECTORY -->
        <section class="lg:col-span-3 flex flex-col h-[480px] lg:h-auto glass-panel rounded-2xl overflow-hidden">
            <div class="grid grid-cols-2 bg-slate-950 border-b dynamic-border text-xs font-display font-bold">
                <button id="tab-chat-btn" class="py-2.5 px-2 text-center dynamic-text border-b-2 dynamic-border bg-slate-900 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-comments"></i> Chat
                </button>
                <button id="tab-peers-btn" class="py-2.5 px-2 text-center text-slate-500 hover:text-slate-300 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-users"></i> Members
                </button>
            </div>

            <!-- CHAT VIEW -->
            <div id="view-chat" class="flex-1 flex flex-col overflow-hidden">
                <div class="p-2 bg-slate-900/50 border-b dynamic-border flex items-center justify-between text-[11px] font-mono">
                    <span id="chat-header-id" class="text-slate-500 font-bold">ID: ---</span>
                    <span id="chat-status" class="text-slate-500 font-bold">OFFLINE</span>
                </div>

                <div id="chat-messages" class="flex-1 p-3 overflow-y-auto flex flex-col gap-2.5 text-xs font-mono">
                    <div class="text-[11px] text-slate-500 text-center py-4 border-b border-slate-800">
                        -- CHAT READY --
                    </div>
                </div>

                <form id="chat-form" class="p-2 bg-slate-950 border-t dynamic-border flex items-center gap-2">
                    <input id="chat-input" type="text" placeholder="Type message..." disabled class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none font-mono">
                    <button id="chat-send-btn" type="submit" disabled class="px-3.5 py-2 dynamic-bg-primary dynamic-bg-hover text-white font-bold rounded-xl text-xs transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>

            <!-- MEMBERS DIRECTORY VIEW -->
            <div id="view-peers" class="hidden flex-1 p-3 flex flex-col gap-3 overflow-y-auto text-xs font-mono">
                <div class="text-[11px] text-slate-500 mb-1 flex items-center justify-between">
                    <span>Available Online Members:</span>
                    <span id="online-counter" class="text-emerald-400 font-bold">1 Online (You)</span>
                </div>
                <div id="members-list-container" class="flex flex-col gap-2"></div>
            </div>
        </section>
    </main>

    <script>
        let peer = null;
        let myPeerId = null;
        let activeDataConn = null;
        let activeCallObj = null;
        let localStream = null;
        
        // Active discovery storage using public public PeerJS metadata room
        const activePeersMap = new Map();
        const DISCOVERY_BROADCAST_ID = "CONNECT_GLOBAL_HUB_2026_ROOM";

        function generate7DigitId() {
            return Math.floor(1000000 + Math.random() * 9000000).toString();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPeerJS();
            setupEventListeners();
        });

        function initPeerJS() {
            const customId = generate7DigitId();
            peer = new Peer(customId, {
                host: '0.peerjs.com',
                secure: true,
                port: 443,
                debug: 1,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                myPeerId = id;
                document.getElementById('my-peer-id').innerText = id;
                document.getElementById('connection-status').innerText = 'Online & Ready.';
                document.getElementById('connection-status').className = 'text-[11px] text-emerald-400 font-mono';
                
                startPresenceHeartbeat();
                renderMembersList();
            });

            // Handle incoming data/chat connections
            peer.on('connection', (conn) => {
                activeDataConn = conn;
                conn.on('open', () => {
                    enableChat();
                    document.getElementById('chat-header-id').innerText = `ID: ${conn.peer}`;
                });
                conn.on('data', (data) => {
                    if (data && data.type === 'PING_PRESENCE') {
                        // Respond back with our info
                        conn.send({ type: 'PONG_PRESENCE', peerId: myPeerId, name: 'User_' + myPeerId.slice(-3) });
                    } else if (data && data.type === 'PONG_PRESENCE') {
                        activePeersMap.set(data.peerId, { name: data.name, lastSeen: Date.now() });
                        renderMembersList();
                    } else if (typeof data === 'string') {
                        appendChatMessage(`ID: ${conn.peer}`, data, false);
                    }
                });
            });

            // Handle incoming video/voice calls
            peer.on('call', async (call) => {
                const stream = await getLocalMediaStream(true);
                if (stream) {
                    call.answer(stream);
                    activeCallObj = call;
                    call.on('stream', (remoteStream) => {
                        const videoEl = document.getElementById('main-video');
                        videoEl.srcObject = remoteStream;
                        videoEl.classList.remove('hidden');
                        document.getElementById('remote-placeholder').classList.add('hidden');
                    });
                }
            });
        }

        function startPresenceHeartbeat() {
            // Broadcast presence ping to known active IDs or connect to discovery node
            setInterval(() => {
                const now = Date.now();
                // Prune inactive peers after 10 seconds
                activePeersMap.forEach((val, key) => {
                    if (now - val.lastSeen > 10000) activePeersMap.delete(key);
                });
                renderMembersList();
            }, 3000);
        }

        function renderMembersList() {
            const container = document.getElementById('members-list-container');
            if (!container) return;

            container.innerHTML = `
                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                    <div>
                        <span class="font-bold text-slate-200 block">You (Active)</span>
                        <span class="text-[10px] text-slate-400">ID: ${myPeerId || '---'}</span>
                    </div>
                    <span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 text-[9px] font-bold">Online</span>
                </div>
            `;

            const peers = Array.from(activePeersMap.entries());
            if (peers.length === 0) {
                container.innerHTML += `
                    <div class="p-6 text-center text-slate-500 text-xs font-mono border border-dashed border-slate-800 rounded-xl mt-2">
                        <i class="fa-solid fa-users-slash text-lg mb-2 block text-slate-600"></i>
                        No active members online right now.<br>Open the link on your phone/laptop to test!
                    </div>
                `;
                document.getElementById('online-counter').innerText = "1 Online (You)";
            } else {
                document.getElementById('online-counter').innerText = `${peers.length + 1} Online`;
                peers.forEach(([pId, data]) => {
                    container.innerHTML += `
                        <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between gap-2 mt-2">
                            <div>
                                <span class="font-bold text-slate-200 text-xs">${data.name}</span>
                                <span class="text-[10px] text-slate-400 font-mono block">ID: ${pId}</span>
                            </div>
                            <button onclick="connectToPeer('${pId}')" class="px-2.5 py-1 rounded-lg dynamic-bg-primary text-white text-[10px] font-bold">
                                Connect
                            </button>
                        </div>
                    `;
                });
            }
        }

        async function getLocalMediaStream(video = true) {
            try {
                if (localStream) return localStream;
                localStream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
                const pipVideo = document.getElementById('pip-video');
                pipVideo.srcObject = localStream;
                pipVideo.classList.remove('hidden');
                document.getElementById('pip-off-placeholder').classList.add('hidden');
                return localStream;
            } catch (err) {
                alert("Camera and microphone permission required for calls.");
                return null;
            }
        }

        function connectToPeer(targetId) {
            document.getElementById('target-peer-id').value = targetId;
            const conn = peer.connect(targetId);
            activeDataConn = conn;
            conn.on('open', () => {
                enableChat();
                document.getElementById('chat-header-id').innerText = `ID: ${targetId}`;
            });
            conn.on('data', (data) => appendChatMessage(`ID: ${conn.peer}`, data, false));
            document.getElementById('tab-chat-btn').click();
        }

        async function initiateCall(isVideo) {
            const targetId = document.getElementById('target-peer-id').value.trim();
            if (!targetId) { alert("Enter a valid Peer ID."); return; }

            const stream = await getLocalMediaStream(isVideo);
            if (!stream) return;

            const call = peer.call(targetId, stream);
            activeCallObj = call;
            call.on('stream', (remoteStream) => {
                const videoEl = document.getElementById('main-video');
                videoEl.srcObject = remoteStream;
                videoEl.classList.remove('hidden');
                document.getElementById('remote-placeholder').classList.add('hidden');
            });
        }

        function enableChat() {
            document.getElementById('chat-input').removeAttribute('disabled');
            document.getElementById('chat-send-btn').removeAttribute('disabled');
            document.getElementById('chat-status').innerText = "ONLINE";
            document.getElementById('chat-status').className = "text-emerald-400 font-bold";
        }

        function appendChatMessage(sender, text, isSelf) {
            const box = document.getElementById('chat-messages');
            box.innerHTML += `
                <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'}">
                    <span class="text-[9px] text-slate-500 mb-0.5">${sender}</span>
                    <div class="px-3 py-1.5 rounded-xl max-w-[85%] break-words ${isSelf ? 'dynamic-bg-primary text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}">${text}</div>
                </div>
            `;
            box.scrollTop = box.scrollHeight;
        }

        function setupEventListeners() {
            document.getElementById('tab-chat-btn').addEventListener('click', () => {
                document.getElementById('view-chat').classList.remove('hidden');
                document.getElementById('view-peers').classList.add('hidden');
            });

            document.getElementById('tab-peers-btn').addEventListener('click', () => {
                document.getElementById('view-peers').classList.remove('hidden');
                document.getElementById('view-chat').classList.add('hidden');
            });

            document.getElementById('btn-start-video').addEventListener('click', () => initiateCall(true));
            document.getElementById('btn-start-voice').addEventListener('click', () => initiateCall(false));
            document.getElementById('btn-start-chat').addEventListener('click', () => connectToPeer(document.getElementById('target-peer-id').value.trim()));

            document.getElementById('chat-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const msg = input.value.trim();
                if (!msg || !activeDataConn) return;
                activeDataConn.send(msg);
                appendChatMessage("You", msg, true);
                input.value = '';
            });

            document.getElementById('btn-end-call').addEventListener('click', () => {
                if (activeCallObj) activeCallObj.close();
                document.getElementById('main-video').classList.add('hidden');
                document.getElementById('remote-placeholder').classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
