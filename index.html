<!DOCTYPE html>
<html lang="en" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONNECT - Unified Call & Chat Suite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        theme: { primary: 'var(--color-primary)', hover: 'var(--color-hover)', border: 'var(--color-border)', text: 'var(--color-text)' }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --color-primary: #6366f1; --color-hover: #4f46e5;
            --color-border: rgba(99, 102, 241, 0.3); --color-text: #818cf8;
            --app-font: 'Inter', sans-serif;
        }
        body { font-family: var(--app-font); background: #09090e; color: #f1f5f9; user-select: none; transition: 0.3s; }
        html.light body { background: #e2e8f0; color: #0f172a; }
        body.screen-protected { filter: blur(25px) grayscale(100%); pointer-events: none; }
        .glass-panel { background: rgba(15, 14, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid var(--color-border); }
        html.light .glass-panel { background: rgba(255, 255, 255, 0.9); box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08); }
        .dynamic-bg-primary { background-color: var(--color-primary); }
        .dynamic-bg-hover:hover { background-color: var(--color-hover); }
        .dynamic-border { border-color: var(--color-border); }
        .dynamic-text { color: var(--color-text); }
        video { object-fit: cover; transform: scaleX(-1); }
        .no-mirror { transform: scaleX(1) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="w-full border-b dynamic-border dark:bg-slate-950/80 bg-white/90 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl dynamic-bg-primary flex items-center justify-center shadow-lg text-white">
                    <i class="fa-solid fa-satellite-dish animate-pulse"></i>
                </div>
                <h1 class="font-bold text-xl md:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500">CONNECT</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-show-auth" class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-user"></i> <span id="auth-btn-text" data-i18n="account">Account</span>
                </button>
                <button id="btn-show-settings" class="w-9 h-9 rounded-lg dynamic-bg-primary dynamic-bg-hover text-white text-sm transition flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl w-full mx-auto p-4 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- LEFT CONTROLS -->
        <section class="lg:col-span-3 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-3 font-mono text-xs flex justify-between items-center">
                <div class="truncate">
                    <div class="text-slate-400"><span data-i18n="user">User</span>: <span id="display-user-handle" class="font-bold text-cyan-400">Guest</span></div>
                    <div class="text-slate-500"><span data-i18n="yourMobile">Mobile / ID</span>: <span id="my-peer-id" class="dynamic-text font-bold">...</span></div>
                </div>
                <button id="copy-id-btn" class="p-2 bg-slate-800 hover:text-indigo-400 rounded transition"><i class="fa-regular fa-copy"></i></button>
            </div>

            <div class="glass-panel rounded-2xl p-3 space-y-3">
                <input id="target-peer-id" type="tel" autocomplete="off" placeholder="Enter Mobile Number" data-i18n-ph="enterMobile" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-xs outline-none focus:border-indigo-400 font-mono">
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start-video" class="rounded-lg dynamic-bg-primary dynamic-bg-hover py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-video"></i> <span data-i18n="videoCall">Video Call</span>
                    </button>
                    <button id="btn-start-voice" class="rounded-lg bg-emerald-600 hover:bg-emerald-500 py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-phone"></i> <span data-i18n="voiceCall">Voice Call</span>
                    </button>
                </div>
                
                <button id="btn-open-group-modal" class="w-full rounded-lg bg-purple-600 hover:bg-purple-500 py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-users-viewfinder"></i> <span data-i18n="groupCall">Group Call (Max 5)</span>
                </button>

                <p id="connection-status" class="text-[11px] text-amber-500 font-mono">Initializing PeerJS...</p>
            </div>
        </section>

        <!-- CENTER DISPLAY -->
        <section class="lg:col-span-6 flex flex-col">
            <div class="relative glass-panel rounded-2xl overflow-hidden min-h-[380px] sm:min-h-[460px] flex items-center justify-center bg-slate-950">
                <video id="main-video" autoplay playsinline class="w-full h-full object-cover hidden no-mirror absolute inset-0"></video>
                <div id="group-video-grid" class="hidden absolute inset-0 w-full h-full p-2 grid gap-2 z-10 bg-slate-950"></div>

                <div id="remote-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
                    <div class="w-20 h-20 rounded-full bg-slate-800 border dynamic-border flex items-center justify-center mb-4 dynamic-text animate-pulse">
                        <i class="fa-solid fa-user text-3xl"></i>
                    </div>
                    <h3 class="font-bold text-slate-200" data-i18n="readyToCall">READY TO CALL</h3>
                    <p class="text-xs text-slate-400 mt-1" data-i18n="callInstructions">Enter a Mobile Number or start a Group Call with up to 5 members.</p>
                </div>

                <div id="pip-container" class="absolute bottom-16 right-4 w-32 h-44 rounded-xl overflow-hidden border-2 dynamic-border bg-slate-900 shadow-2xl z-20">
                    <video id="pip-video" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
                    <div id="pip-off-placeholder" class="absolute inset-0 flex items-center justify-center bg-slate-900 text-slate-500 text-xs font-mono" data-i18n="cameraOff">Camera Off</div>
                </div>

                <!-- CONTROLS BAR -->
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-slate-950/85 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-2xl z-30">
                    <button id="btn-toggle-mic" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition"><i class="fa-solid fa-microphone"></i></button>
                    <button id="btn-toggle-cam" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition"><i class="fa-solid fa-video"></i></button>
                    <button id="btn-midcall-add" class="hidden px-3.5 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-user-plus"></i> <span data-i18n="add">Add</span>
                    </button>
                    <button id="btn-end-call" class="w-10 h-10 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center transition"><i class="fa-solid fa-phone-slash"></i></button>
                </div>
            </div>
        </section>

        <!-- RIGHT MEMBERS DIRECTORY -->
        <section class="lg:col-span-3 glass-panel rounded-2xl p-3 flex flex-col gap-3 font-mono text-xs">
            <div class="flex justify-between items-center text-slate-400">
                <span data-i18n="availableOnlineMembers">Online Members:</span>
                <span id="online-counter" class="text-emerald-400 font-bold">1</span>
            </div>
            <div id="members-list-container" class="flex flex-col gap-2 overflow-y-auto max-h-[400px]"></div>
        </section>

    </main>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-lg dynamic-text"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">SETTINGS</span></h3>
                <button id="close-settings-btn" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1" data-i18n="language">LANGUAGE</label>
                <div class="grid grid-cols-3 gap-2">
                    <button data-lang="en" class="lang-btn p-2 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">English</button>
                    <button data-lang="te" class="lang-btn p-2 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">తెలుగు</button>
                    <button data-lang="hi" class="lang-btn p-2 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">हिंदी</button>
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1" data-i18n="fontStyle">FONT STYLE</label>
                <select id="select-app-font" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs">
                    <option value="'Inter', sans-serif">Inter (Default)</option>
                    <option value="'Orbitron', sans-serif">Orbitron (Cyber)</option>
                    <option value="'Fira Code', monospace">Fira Code (Mono)</option>
                    <option value="'Noto Sans Telugu', sans-serif">Noto Sans Telugu</option>
                    <option value="'Noto Sans Devanagari', sans-serif">Noto Sans Devanagari (Hindi)</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1" data-i18n="mobileNumber">YOUR MOBILE NUMBER</label>
                <input id="user-mobile-input" type="tel" placeholder="Enter mobile number" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs">
            </div>

            <div class="flex items-center gap-4">
                <div class="relative w-16 h-16 rounded-full bg-slate-900 border-2 dynamic-border flex items-center justify-center shrink-0">
                    <img id="profile-img-preview" src="" class="w-full h-full rounded-full object-cover hidden">
                    <i id="profile-img-placeholder" class="fa-solid fa-user text-2xl dynamic-text"></i>
                    <button id="btn-remove-avatar" type="button" class="hidden absolute -top-1 -right-1 w-6 h-6 rounded-full bg-rose-600 hover:bg-rose-500 text-white text-[10px] items-center justify-center border-2 border-slate-900 shadow">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
                <button id="btn-upload-avatar" type="button" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs border border-slate-700">
                    <i class="fa-solid fa-camera mr-1"></i> <span data-i18n="uploadImage">Upload Image</span>
                </button>
                <input id="profile-img-input" type="file" accept="image/*" class="hidden">
            </div>

            <button id="save-settings-btn" class="w-full py-2.5 rounded-xl dynamic-bg-primary dynamic-bg-hover font-bold text-white text-xs shadow-lg mt-2" data-i18n="saveChanges">
                SAVE CHANGES
            </button>
        </div>
    </div>

    <!-- GROUP CALL MODAL -->
    <div id="group-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 flex flex-col gap-4">
            <h3 class="font-bold text-purple-400" data-i18n="selectGroupMembers">Select Online Group Members</h3>
            <div id="group-selection-list" class="max-h-60 overflow-y-auto flex flex-col gap-2 font-mono text-xs"></div>
            <div class="flex justify-between items-center border-t border-slate-800 pt-3">
                <span id="group-selected-count" class="text-xs font-mono text-slate-400">Selected: 0/5</span>
                <button id="btn-start-group-call" disabled class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-bold text-xs" data-i18n="startGroupCall">
                    Start Group Call
                </button>
            </div>
        </div>
    </div>

    <!-- MID-CALL ADD MODAL -->
    <div id="midcall-add-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full rounded-2xl p-6 flex flex-col gap-4">
            <h3 class="font-bold text-indigo-400" data-i18n="addPerson">Add Person to Call</h3>
            <div id="midcall-selection-list" class="max-h-52 overflow-y-auto flex flex-col gap-2 font-mono text-xs"></div>
            <button onclick="document.getElementById('midcall-add-modal').classList.add('hidden')" class="w-full py-2 rounded-xl bg-slate-800 text-xs">Close</button>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const i18n = {
            en: { account: "Account", user: "User", yourMobile: "Mobile / ID", enterMobile: "Enter Mobile Number", videoCall: "Video Call", voiceCall: "Voice Call", groupCall: "Group Call (Max 5)", readyToCall: "READY TO CALL", callInstructions: "Enter a Mobile Number or start a Group Call with up to 5 members.", cameraOff: "Camera Off", you: "You", add: "Add", availableOnlineMembers: "Online Members:", settings: "SETTINGS", language: "LANGUAGE", fontStyle: "FONT STYLE", mobileNumber: "YOUR MOBILE NUMBER", uploadImage: "Upload Image", saveChanges: "SAVE CHANGES", selectGroupMembers: "Select Group Members", startGroupCall: "Start Group Call", addPerson: "Add Person to Call" },
            te: { account: "ఖాతా", user: "వాడుకరి", yourMobile: "మొబైల్ / ID", enterMobile: "మొబైల్ నంబరు నమోదు చేయండి", videoCall: "వీడియో కాల్", voiceCall: "వాయిస్ కాల్", groupCall: "గ్రూప్ కాల్ (గరిష్టం 5)", readyToCall: "కాల్ చేయడానికి సిద్ధంగా ఉంది", callInstructions: "మొబైల్ నంబరును ఎంటర్ చేయండి లేదా 5 మందితో గ్రూప్ కాల్ ప్రారంభించండి.", cameraOff: "కెమెరా ఆఫ్", you: "మీరు", add: "జోడించు", availableOnlineMembers: "ఆన్‌లైన్ సభ్యులు:", settings: "సెట్టింగ్‌లు", language: "భాష", fontStyle: "ఫాంట్ శైలి", mobileNumber: "మీ మొబైల్ నంబర్", uploadImage: "చిత్రాన్ని అప్‌లోడ్ చేయండి", saveChanges: "సేవ్ చేయండి", selectGroupMembers: "సభ్యులను ఎంచుకోండి", startGroupCall: "గ్రూప్ కాల్ ప్రారంభించండి", addPerson: "వ్యక్తిని జోడించండి" },
            hi: { account: "खाता", user: "उपयोगकर्ता", yourMobile: "मोबाइल / ID", enterMobile: "मोबाइल नंबर दर्ज करें", videoCall: "वीडियो कॉल", voiceCall: "वॉयस कॉल", groupCall: "ग्रुप कॉल (अधिकतम 5)", readyToCall: "कॉल के लिए तैयार", callInstructions: "मोबाइल नंबर दर्ज करें या 5 सदस्यों के साथ ग्रुप कॉल शुरू करें।", cameraOff: "कैमरा बंद", you: "आप", add: "जोड़ें", availableOnlineMembers: "ऑनलाइन सदस्य:", settings: "सेटिंग्स", language: "भाषा", fontStyle: "फ़ॉन्ट स्टाइल", mobileNumber: "आपका मोबाइल नंबर", uploadImage: "छवि अपलोड करें", saveChanges: "सहेजें", selectGroupMembers: "सदस्य चुनें", startGroupCall: "ग्रुप कॉल शुरू करें", addPerson: "व्यक्ति जोड़ें" }
        };

        let peer = null, myPeerId = null, localStream = null;
        let activeCalls = new Map(), remoteStreamsMap = new Map();
        let activeDataConn = null;

        let userMobile = localStorage.getItem('user_mobile') || ('9' + Math.floor(100000000 + Math.random() * 900000000));
        let appLanguage = localStorage.getItem('user_language') || 'en';
        let appFont = localStorage.getItem('user_font') || "'Inter', sans-serif";
        let stagedLang = appLanguage, stagedFont = appFont, stagedAvatar = null, stagedMobile = userMobile;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-mobile-input').value = userMobile;
            initPeer();
            setupEvents();
            applySettings(appLanguage, appFont);
        });

        function applySettings(lang, font) {
            appLanguage = lang; appFont = font;
            document.documentElement.style.setProperty('--app-font', font);
            const dict = i18n[lang] || i18n.en;
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = dict[el.dataset.i18n] || el.innerText);
            document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = dict[el.dataset.i18nPh] || el.placeholder);
        }

        function initPeer() {
            peer = new Peer(userMobile, { host: '0.peerjs.com', port: 443, secure: true });
            peer.on('open', id => {
                myPeerId = id;
                document.getElementById('my-peer-id').innerText = id;
                document.getElementById('connection-status').innerText = "Online";
                document.getElementById('connection-status').className = "text-[11px] text-emerald-400 font-mono";
            });
            peer.on('error', err => {
                if (err.type === 'unavailable-id') {
                    alert("This Mobile Number is already active in another session.");
                }
            });
            peer.on('connection', conn => {
                activeDataConn = conn;
                setupConnectionListeners(conn);
            });
            peer.on('call', call => {
                if (confirm(`Incoming call from ${call.peer}. Answer?`)) {
                    getLocalStream(call.metadata && call.metadata.type === 'video').then(stream => {
                        call.answer(stream);
                        handleCallStream(call);
                    });
                }
            });
        }

        function setupConnectionListeners(conn) {
            conn.on('open', () => {
                document.getElementById('target-peer-id').value = conn.peer;
                document.getElementById('connection-status').innerText = `Connected with: ${conn.peer}`;
            });
            conn.on('close', () => {
                activeDataConn = null;
                document.getElementById('connection-status').innerText = "Online (Chat disconnected)";
            });
        }

        async function getLocalStream(enableVideo = true) {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ video: enableVideo, audio: true });
            }
            return localStream;
        }

        function handleCallStream(call) {
            activeCalls.set(call.peer, call);
            call.on('stream', stream => {
                remoteStreamsMap.set(call.peer, stream);
                renderGrid();
            });
            call.on('close', () => {
                activeCalls.delete(call.peer);
                remoteStreamsMap.delete(call.peer);
                renderGrid();
            });
        }

        function renderGrid() {
            const grid = document.getElementById('group-video-grid');
            const mainVid = document.getElementById('main-video');
            const placeholder = document.getElementById('remote-placeholder');
            const midAddBtn = document.getElementById('btn-midcall-add');
            const activeIds = Array.from(remoteStreamsMap.keys());
            const total = activeIds.length + 1;

            midAddBtn.classList.toggle('hidden', total < 2);

            if (activeIds.length === 0) {
                grid.classList.add('hidden');
                mainVid.classList.add('hidden');
                placeholder.classList.remove('hidden');
                return;
            }

            placeholder.classList.add('hidden');

            if (activeIds.length === 1) {
                grid.classList.add('hidden');
                mainVid.classList.remove('hidden');
                mainVid.srcObject = remoteStreamsMap.get(activeIds[0]);
                document.getElementById('pip-video').srcObject = localStream;
                document.getElementById('pip-video').classList.remove('hidden');
            } else {
                mainVid.classList.add('hidden');
                grid.classList.remove('hidden');
                grid.innerHTML = '';
                
                const selfDiv = document.createElement('div');
                selfDiv.className = "relative rounded-xl overflow-hidden border dynamic-border bg-slate-900";
                selfDiv.innerHTML = `<video id="self-grid-vid" autoplay playsinline muted class="w-full h-full object-cover"></video>`;
                grid.appendChild(selfDiv);
                selfDiv.querySelector('#self-grid-vid').srcObject = localStream;

                activeIds.forEach(id => {
                    const div = document.createElement('div');
                    div.className = "relative rounded-xl overflow-hidden border dynamic-border bg-slate-900";
                    div.innerHTML = `<video id="grid-vid-${id}" autoplay playsinline class="w-full h-full object-cover no-mirror"></video>`;
                    grid.appendChild(div);
                    div.querySelector(`#grid-vid-${id}`).srcObject = remoteStreamsMap.get(id);
                });
            }
        }

        function sendOfflineInvite(targetNumber) {
            const appUrl = window.location.href;
            const msg = `Hey! Join my call on CONNECT here: ${appUrl}`;
            
            if (confirm(`User (${targetNumber}) is offline/not registered right now. Send an invite SMS?`)) {
                if (navigator.share) {
                    navigator.share({ title: 'Join Call', text: msg, url: appUrl }).catch(() => {});
                } else {
                    window.location.href = `sms:${targetNumber}?body=${encodeURIComponent(msg)}`;
                }
            }
        }

        async function triggerCall(isVideo) {
            let target = document.getElementById('target-peer-id').value.trim();

            // Automatic target check: if input box is empty, use active chat connection peer ID if available
            if (!target && activeDataConn && activeDataConn.peer) {
                target = activeDataConn.peer;
                document.getElementById('target-peer-id').value = target;
            }

            if (!target) {
                return alert("Please enter a Mobile Number or connect with someone in chat first.");
            }

            const stream = await getLocalStream(isVideo);
            const call = peer.call(target, stream, { metadata: { type: isVideo ? 'video' : 'voice' } });

            let connected = false;
            call.on('stream', () => { connected = true; });

            setTimeout(() => {
                if (!connected && activeCalls.size === 0) {
                    sendOfflineInvite(target);
                }
            }, 4000);

            handleCallStream(call);
        }

        function setupEvents() {
            document.getElementById('btn-start-video').onclick = () => triggerCall(true);
            document.getElementById('btn-start-voice').onclick = () => triggerCall(false);

            document.getElementById('btn-end-call').onclick = () => {
                activeCalls.forEach(c => c.close());
                activeCalls.clear(); remoteStreamsMap.clear();
                if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
                renderGrid();
            };

            document.getElementById('btn-show-settings').onclick = () => {
                stagedLang = appLanguage; stagedFont = appFont;
                document.getElementById('settings-modal').classList.remove('hidden');
            };

            document.getElementById('close-settings-btn').onclick = () => {
                document.getElementById('settings-modal').classList.add('hidden');
            };

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.onclick = (e) => stagedLang = e.currentTarget.dataset.lang;
            });

            document.getElementById('select-app-font').onchange = (e) => stagedFont = e.target.value;

            document.getElementById('btn-upload-avatar').onclick = () => document.getElementById('profile-img-input').click();
            document.getElementById('profile-img-input').onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = (ev) => {
                    stagedAvatar = ev.target.result;
                    document.getElementById('profile-img-preview').src = stagedAvatar;
                    document.getElementById('profile-img-preview').classList.remove('hidden');
                    document.getElementById('btn-remove-avatar').classList.remove('hidden');
                };
                r.readAsDataURL(file);
            };

            document.getElementById('btn-remove-avatar').onclick = () => {
                stagedAvatar = '';
                document.getElementById('profile-img-preview').classList.add('hidden');
                document.getElementById('btn-remove-avatar').classList.add('hidden');
            };

            document.getElementById('save-settings-btn').onclick = () => {
                const newMobile = document.getElementById('user-mobile-input').value.trim();
                if (newMobile) {
                    localStorage.setItem('user_mobile', newMobile);
                    userMobile = newMobile;
                }

                localStorage.setItem('user_language', stagedLang);
                localStorage.setItem('user_font', stagedFont);
                if (stagedAvatar === '') localStorage.removeItem('user_avatar');
                else if (stagedAvatar) localStorage.setItem('user_avatar', stagedAvatar);
                
                applySettings(stagedLang, stagedFont);
                document.getElementById('settings-modal').classList.add('hidden');
                alert("Settings Saved Successfully! Reload page to re-bind new mobile number if changed.");
            };
        }
    </script>
</body>
</html>
