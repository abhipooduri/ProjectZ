<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONNECT - Cross Device WebRTC Suite</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- MQTT WebSocket Client for Global Cross-Device Presence Discovery -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

    <style>
        :root {
            --color-primary: #6366f1;
            --color-hover: #4f46e5;
            --color-border: rgba(99, 102, 241, 0.3);
            --color-text: #818cf8;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #09090e;
            color: #f1f5f9;
        }
        .glass-panel {
            background: rgba(15, 14, 38, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--color-border);
        }
        video { object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 sm:p-4">

    <!-- HEADER -->
    <header class="w-full glass-panel rounded-2xl p-4 mb-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-satellite-dish text-lg animate-pulse"></i>
            </div>
            <h1 class="font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500">
                CONNECT
            </h1>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-emerald-500/40 bg-emerald-950/20 text-emerald-400 text-xs font-mono">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
            <span id="network-status">ONLINE</span>
        </div>
    </header>

    <!-- MAIN BODY GRID -->
    <main class="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5">

        <!-- LEFT CONTROLS -->
        <section class="lg:col-span-3 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-3 text-xs font-mono">
                <div class="text-slate-400">Device Tag: <span id="device-label" class="text-cyan-400 font-bold">Detecting...</span></div>
                <div class="text-slate-500 mt-1">Your ID: <span id="my-peer-id" class="text-indigo-400 font-bold">Initializing...</span></div>
            </div>

            <div class="glass-panel rounded-2xl p-3 space-y-3">
                <input id="target-peer-id" type="text" readonly placeholder="Click Connect on a member" class="w-full rounded-lg bg-slate-950 border border-slate-700 px-3 py-2 text-xs text-slate-300 font-mono outline-none">
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start-video" class="py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs font-bold text-white transition flex items-center justify-center gap-1.5 shadow-md">
                        <i class="fa-solid fa-video"></i> Video Call
                    </button>
                    <button id="btn-start-voice" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-bold text-white transition flex items-center justify-center gap-1.5 shadow-md">
                        <i class="fa-solid fa-phone"></i> Voice Call
                    </button>
                </div>

                <p id="conn-log" class="text-[11px] text-amber-400 font-mono">Connecting discovery network...</p>
            </div>
        </section>

        <!-- CENTER VIDEO DISPLAY -->
        <section class="lg:col-span-6 flex flex-col gap-4">
            <div class="relative glass-panel rounded-2xl overflow-hidden h-[380px] sm:h-[450px] flex items-center justify-center bg-slate-950">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden absolute inset-0"></video>
                
                <div id="remote-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-950/90 z-0">
                    <div class="w-20 h-20 rounded-full bg-slate-900 border border-indigo-500/30 flex items-center justify-center mb-4 text-indigo-400 animate-pulse shadow-lg">
                        <i class="fa-solid fa-user text-3xl"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-200">READY TO CONNECT</h3>
                    <p class="text-xs text-slate-400 max-w-xs mt-1">Open this link on your phone or laptop. Active members update automatically.</p>
                </div>

                <!-- PIP LOCAL PREVIEW -->
                <div id="pip-container" class="absolute bottom-16 right-4 w-32 h-44 rounded-xl overflow-hidden border-2 border-indigo-500/40 bg-slate-900 shadow-2xl z-20">
                    <video id="pip-video" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
                    <div id="pip-off-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 text-slate-500 text-center p-2">
                        <i class="fa-solid fa-user-slash text-xl mb-1"></i>
                        <span class="text-[9px] font-mono">Camera Off</span>
                    </div>
                </div>

                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-slate-950/85 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-2xl z-30">
                    <button id="btn-end-call" class="w-10 h-10 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center text-sm transition shadow-lg">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- RIGHT TAB NAVIGATION & ACTIVE MEMBERS LIST -->
        <section class="lg:col-span-3 flex flex-col h-[480px] lg:h-auto glass-panel rounded-2xl overflow-hidden">
            <div class="grid grid-cols-2 bg-slate-950 border-b border-indigo-500/30 text-xs font-bold">
                <button id="tab-peers-btn" class="py-2.5 px-2 text-center text-indigo-400 border-b-2 border-indigo-500 bg-slate-900 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-users"></i> Members
                </button>
                <button id="tab-chat-btn" class="py-2.5 px-2 text-center text-slate-500 hover:text-slate-300 transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-comments"></i> Chat
                </button>
            </div>

            <!-- MEMBERS DIRECTORY VIEW -->
            <div id="view-peers" class="flex-1 p-3 flex flex-col gap-3 overflow-y-auto text-xs font-mono">
                <div class="text-[11px] text-slate-500 mb-1 flex items-center justify-between">
                    <span>Available Active Members:</span>
                    <span id="online-counter" class="text-emerald-400 font-bold">1 Online</span>
                </div>
                <div id="members-list-container" class="flex flex-col gap-2"></div>
            </div>

            <!-- CHAT VIEW -->
            <div id="view-chat" class="hidden flex-1 flex flex-col overflow-hidden">
                <div class="p-2 bg-slate-900/50 border-b border-indigo-500/30 flex items-center justify-between text-[11px] font-mono">
                    <span id="chat-header-id" class="text-slate-500 font-bold">No active session</span>
                </div>
                <div id="chat-messages" class="flex-1 p-3 overflow-y-auto flex flex-col gap-2.5 text-xs font-mono">
                    <div class="text-[11px] text-slate-500 text-center py-4 border-b border-slate-800">
                        -- Connect to a member to start chat --
                    </div>
                </div>
                <form id="chat-form" class="p-2 bg-slate-950 border-t border-indigo-500/30 flex items-center gap-2">
                    <input id="chat-input" type="text" placeholder="Type message..." disabled class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none">
                    <button id="chat-send-btn" type="submit" disabled class="px-3.5 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </section>

    </main>

    <script>
        let peer = null;
        let myPeerId = null;
        let mqttClient = null;
        let activeConn = null;
        let activeCall = null;
        let localStream = null;

        const MQTT_TOPIC = "connect_suite_2026_room_global";
        const activePeersMap = new Map();

        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        const deviceType = isMobile ? 'Phone' : 'Laptop';

        function generate7DigitId() {
            return Math.floor(1000000 + Math.random() * 9000000).toString();
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('device-label').innerText = `${deviceType} Device`;
            initPeerJS();
            setupUIEvents();
        });

        function initPeerJS() {
            const customId = generate7DigitId();
            peer = new Peer(customId, {
                host: '0.peerjs.com',
                secure: true,
                port: 443,
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                myPeerId = id;
                document.getElementById('my-peer-id').innerText = id;
                document.getElementById('conn-log').innerText = 'Connected to WebRTC.';
                document.getElementById('conn-log').className = 'text-[11px] text-emerald-400 font-mono';
                
                initMQTTDiscovery();
            });

            peer.on('connection', (conn) => {
                activeConn = conn;
                setupDataConn(conn);
            });

            peer.on('call', async (call) => {
                const stream = await getLocalMediaStream(true);
                if (stream) {
                    call.answer(stream);
                    activeCall = call;
                    call.on('stream', (remoteStream) => {
                        const rv = document.getElementById('remote-video');
                        rv.srcObject = remoteStream;
                        rv.classList.remove('hidden');
                        document.getElementById('remote-placeholder').classList.add('hidden');
                    });
                }
            });
        }

        // MQTT GLOBAL PRESENCE SYNC
        function initMQTTDiscovery() {
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                mqttClient.subscribe(MQTT_TOPIC);
                broadcastPresence();

                // Heartbeat every 4 seconds
                setInterval(broadcastPresence, 4000);
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.peerId && data.peerId !== myPeerId) {
                        activePeersMap.set(data.peerId, { name: data.name, lastSeen: Date.now() });
                        renderMembersList();
                    }
                } catch(e) {}
            });

            // Prune stale peers every 3 seconds
            setInterval(() => {
                const now = Date.now();
                activePeersMap.forEach((val, key) => {
                    if (now - val.lastSeen > 10000) activePeersMap.delete(key);
                });
                renderMembersList();
            }, 3000);
        }

        function broadcastPresence() {
            if (!mqttClient || !myPeerId) return;
            const payload = JSON.stringify({
                peerId: myPeerId,
                name: `${deviceType} (${myPeerId.slice(-3)})`
            });
            mqttClient.publish(MQTT_TOPIC, payload);
        }

        function renderMembersList() {
            const container = document.getElementById('members-list-container');
            if (!container) return;

            container.innerHTML = `
                <div class="p-3 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                    <div>
                        <span class="font-bold text-slate-200 block">You (${deviceType})</span>
                        <span class="text-[10px] text-slate-400">ID: ${myPeerId || '---'}</span>
                    </div>
                    <span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 text-[9px] font-bold">Active</span>
                </div>
            `;

            const otherPeers = Array.from(activePeersMap.entries());

            if (otherPeers.length === 0) {
                container.innerHTML += `
                    <div class="p-6 text-center text-slate-500 text-xs font-mono border border-dashed border-slate-800 rounded-xl mt-2">
                        <i class="fa-solid fa-users-slash text-xl mb-2 block text-slate-600"></i>
                        No other active members online right now.<br>Open this link on your phone/laptop to connect!
                    </div>
                `;
                document.getElementById('online-counter').innerText = "1 Online (You)";
            } else {
                document.getElementById('online-counter').innerText = `${otherPeers.length + 1} Online`;
                otherPeers.forEach(([pId, data]) => {
                    const isConnected = activeConn && activeConn.peer === pId;
                    container.innerHTML += `
                        <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex items-center justify-between gap-2 mt-2">
                            <div>
                                <span class="font-bold text-slate-200 text-xs">${data.name}</span>
                                <span class="text-[10px] text-slate-400 font-mono block">ID: ${pId}</span>
                            </div>
                            <button onclick="connectToPeer('${pId}', '${data.name}')" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-md">
                                ${isConnected ? 'Connected' : 'Connect'}
                            </button>
                        </div>
                    `;
                });
            }
        }

        // ONE-CLICK CONNECT HANDLER
        function connectToPeer(targetId, targetName) {
            document.getElementById('target-peer-id').value = targetId;
            activeConn = peer.connect(targetId);
            setupDataConn(activeConn);

            document.getElementById('tab-chat-btn').click();
            document.getElementById('chat-header-id').innerText = `Session: ${targetName}`;
        }

        function setupDataConn(conn) {
            conn.on('open', () => {
                document.getElementById('chat-input').removeAttribute('disabled');
                document.getElementById('chat-send-btn').removeAttribute('disabled');
            });
            conn.on('data', (msg) => appendMessage('Peer', msg, false));
        }

        async function getLocalMediaStream(video = true) {
            try {
                if (localStream) return localStream;
                localStream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
                const pip = document.getElementById('pip-video');
                pip.srcObject = localStream;
                pip.classList.remove('hidden');
                document.getElementById('pip-off-placeholder').classList.add('hidden');
                return localStream;
            } catch (err) {
                alert("Camera and microphone permission required for calls.");
                return null;
            }
        }

        async function startCall(video) {
            const targetId = document.getElementById('target-peer-id').value.trim();
            if (!targetId) { alert("Click 'Connect' on an active member first!"); return; }

            const stream = await getLocalMediaStream(video);
            if (!stream) return;

            activeCall = peer.call(targetId, stream);
            activeCall.on('stream', (remoteStream) => {
                const rv = document.getElementById('remote-video');
                rv.srcObject = remoteStream;
                rv.classList.remove('hidden');
                document.getElementById('remote-placeholder').classList.add('hidden');
            });
        }

        function appendMessage(sender, text, isSelf) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;
            div.innerHTML = `<span class="text-[9px] text-slate-500">${sender}</span><div class="px-3 py-1.5 rounded-xl max-w-[85%] break-words ${isSelf ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function setupUIEvents() {
            document.getElementById('tab-peers-btn').addEventListener('click', () => {
                document.getElementById('view-peers').classList.remove('hidden');
                document.getElementById('view-chat').classList.add('hidden');
            });
            document.getElementById('tab-chat-btn').addEventListener('click', () => {
                document.getElementById('view-chat').classList.remove('hidden');
                document.getElementById('view-peers').classList.add('hidden');
            });

            document.getElementById('btn-start-video').addEventListener('click', () => startCall(true));
            document.getElementById('btn-start-voice').addEventListener('click', () => startCall(false));

            document.getElementById('chat-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const msg = input.value.trim();
                if (msg && activeConn) {
                    activeConn.send(msg);
                    appendMessage("You", msg, true);
                    input.value = '';
                }
            });

            document.getElementById('btn-end-call').addEventListener('click', () => {
                if (activeCall) activeCall.close();
                document.getElementById('remote-video').classList.add('hidden');
                document.getElementById('remote-placeholder').classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
