<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT - Cross-Device Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">

    <div class="max-w-md w-full bg-slate-900 border border-indigo-500/30 rounded-2xl p-5 shadow-2xl space-y-4">
        
        <!-- HEADER -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h1 class="font-bold text-lg text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish animate-pulse"></i> CONNECT
            </h1>
            <span id="status-badge" class="px-2.5 py-1 rounded-full text-[10px] font-mono bg-amber-950 text-amber-400 border border-amber-500/30">
                CONNECTING...
            </span>
        </div>

        <!-- YOUR PEER ID -->
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-mono flex items-center justify-between">
            <div>
                <span class="text-slate-500 block text-[10px]">YOUR DEVICE ID</span>
                <span id="my-id" class="text-indigo-300 font-bold text-sm">Generating...</span>
            </div>
            <button id="copy-btn" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition">
                Copy
            </button>
        </div>

        <!-- TARGET PEER INPUT -->
        <div class="space-y-2">
            <label class="text-xs font-mono text-slate-400">ENTER OTHER DEVICE ID:</label>
            <div class="flex gap-2">
                <input id="target-id" type="text" placeholder="e.g. 849201" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                <button id="connect-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl transition">
                    Connect
                </button>
            </div>
        </div>

        <!-- VIDEO CALL SECTION -->
        <div class="relative bg-black rounded-xl overflow-hidden h-52 border border-slate-800 flex items-center justify-center">
            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
            <div id="video-placeholder" class="text-center p-4">
                <i class="fa-solid fa-video-slash text-2xl text-slate-600 mb-1"></i>
                <p class="text-xs text-slate-500">No active video stream</p>
            </div>
            <video id="local-video" autoplay playsinline muted class="absolute bottom-2 right-2 w-20 h-28 object-cover rounded-lg border border-indigo-500 hidden"></video>
        </div>

        <!-- CALL CONTROLS -->
        <div class="grid grid-cols-2 gap-2">
            <button id="call-btn" class="py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-video"></i> Start Video Call
            </button>
            <button id="end-btn" class="py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-phone-slash"></i> End Call
            </button>
        </div>

        <!-- CHAT SECTION -->
        <div class="border-t border-slate-800 pt-3 flex flex-col h-40">
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-1.5 text-xs font-mono p-1">
                <div class="text-[10px] text-slate-600 text-center">--- Ready for data exchange ---</div>
            </div>
            <form id="chat-form" class="flex gap-2 mt-2">
                <input id="chat-input" type="text" placeholder="Type message..." disabled class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                <button id="send-btn" type="submit" disabled class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-xl disabled:opacity-40">Send</button>
            </form>
        </div>

    </div>

    <script>
        let peer = null;
        let myId = null;
        let activeConn = null;
        let activeCall = null;
        let localStream = null;

        // Generate clean 6-digit peer ID
        const customId = Math.floor(100000 + Math.random() * 900000).toString();

        window.addEventListener('DOMContentLoaded', () => {
            peer = new Peer(customId, {
                host: '0.peerjs.com',
                secure: true,
                port: 443,
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                myId = id;
                document.getElementById('my-id').innerText = id;
                const badge = document.getElementById('status-badge');
                badge.innerText = 'READY';
                badge.className = 'px-2.5 py-1 rounded-full text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-500/30';
            });

            peer.on('connection', (conn) => {
                activeConn = conn;
                setupConnectionListeners(conn);
            });

            peer.on('call', async (call) => {
                const stream = await getMedia();
                if (stream) {
                    call.answer(stream);
                    activeCall = call;
                    call.on('stream', (remoteStream) => {
                        const rv = document.getElementById('remote-video');
                        rv.srcObject = remoteStream;
                        rv.classList.remove('hidden');
                        document.getElementById('video-placeholder').classList.add('hidden');
                    });
                }
            });

            peer.on('error', (err) => {
                alert('PeerJS Error: ' + err.type);
            });
        });

        function setupConnectionListeners(conn) {
            conn.on('open', () => {
                document.getElementById('chat-input').removeAttribute('disabled');
                document.getElementById('send-btn').removeAttribute('disabled');
                appendMessage('System', 'Connected to ' + conn.peer, 'text-emerald-400');
            });

            conn.on('data', (data) => {
                appendMessage('Peer', data, 'text-cyan-400');
            });

            conn.on('close', () => {
                appendMessage('System', 'Connection closed.', 'text-rose-400');
            });
        }

        async function getMedia() {
            try {
                if (localStream) return localStream;
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const lv = document.getElementById('local-video');
                lv.srcObject = localStream;
                lv.classList.remove('hidden');
                return localStream;
            } catch (e) {
                alert('Microphone/Camera permission denied or not supported over HTTP.');
                return null;
            }
        }

        document.getElementById('connect-btn').addEventListener('click', () => {
            const targetId = document.getElementById('target-id').value.trim();
            if (!targetId) return alert('Enter target ID');
            activeConn = peer.connect(targetId);
            setupConnectionListeners(activeConn);
        });

        document.getElementById('call-btn').addEventListener('click', async () => {
            const targetId = document.getElementById('target-id').value.trim();
            if (!targetId) return alert('Enter target ID');
            const stream = await getMedia();
            if (!stream) return;

            activeCall = peer.call(targetId, stream);
            activeCall.on('stream', (remoteStream) => {
                const rv = document.getElementById('remote-video');
                rv.srcObject = remoteStream;
                rv.classList.remove('hidden');
                document.getElementById('video-placeholder').classList.add('hidden');
            });
        });

        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (msg && activeConn) {
                activeConn.send(msg);
                appendMessage('You', msg, 'text-indigo-400');
                input.value = '';
            }
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            if (myId) {
                navigator.clipboard.writeText(myId);
                alert('Copied ID: ' + myId);
            }
        });

        document.getElementById('end-btn').addEventListener('click', () => {
            if (activeCall) activeCall.close();
            if (activeConn) activeConn.close();
            document.getElementById('remote-video').classList.add('hidden');
            document.getElementById('video-placeholder').classList.remove('hidden');
        });

        function appendMessage(sender, text, colorClass) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.innerHTML = `<span class="${colorClass} font-bold">${sender}:</span> ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
