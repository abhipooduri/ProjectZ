<!DOCTYPE html>
<html lang="en" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONNECT - Unified Call & Chat Suite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        theme: { primary: 'var(--color-primary)', hover: 'var(--color-hover)', border: 'var(--color-border)', text: 'var(--color-text)' }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --color-primary: #6366f1; --color-hover: #4f46e5;
            --color-border: rgba(99, 102, 241, 0.3); --color-text: #818cf8;
            --app-font: 'Inter', sans-serif;
        }
        body { font-family: var(--app-font); background: #09090e; color: #f1f5f9; user-select: none; transition: 0.3s; }
        html.light body { background: #e2e8f0; color: #0f172a; }
        .glass-panel { background: rgba(15, 14, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid var(--color-border); }
        html.light .glass-panel { background: rgba(255, 255, 255, 0.9); box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08); }
        .dynamic-bg-primary { background-color: var(--color-primary); }
        .dynamic-bg-hover:hover { background-color: var(--color-hover); }
        .dynamic-border { border-color: var(--color-border); }
        .dynamic-text { color: var(--color-text); }
        video { object-fit: cover; transform: scaleX(-1); }
        .no-mirror { transform: scaleX(1) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="w-full border-b dynamic-border dark:bg-slate-950/80 bg-white/90 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl dynamic-bg-primary flex items-center justify-center shadow-lg text-white">
                    <i class="fa-solid fa-satellite-dish animate-pulse"></i>
                </div>
                <h1 class="font-bold text-xl md:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500">CONNECT</h1>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-show-settings" class="w-9 h-9 rounded-lg dynamic-bg-primary dynamic-bg-hover text-white text-sm transition flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl w-full mx-auto p-4 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- LEFT CONTROLS -->
        <section class="lg:col-span-3 flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-3 font-mono text-xs flex justify-between items-center">
                <div class="truncate">
                    <div class="text-slate-400">User: <span id="display-user-handle" class="font-bold text-cyan-400">Guest</span></div>
                    <div class="text-slate-500">Mobile / ID: <span id="my-peer-id" class="dynamic-text font-bold">...</span></div>
                </div>
                <button id="copy-id-btn" class="p-2 bg-slate-800 hover:text-indigo-400 rounded transition"><i class="fa-regular fa-copy"></i></button>
            </div>

            <div class="glass-panel rounded-2xl p-3 space-y-3">
                <input id="target-peer-id" type="tel" autocomplete="off" placeholder="Enter Mobile Number" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-xs outline-none focus:border-indigo-400 font-mono">
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-start-video" class="rounded-lg dynamic-bg-primary dynamic-bg-hover py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-video"></i> <span>Video Call</span>
                    </button>
                    <button id="btn-start-voice" class="rounded-lg bg-emerald-600 hover:bg-emerald-500 py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-phone"></i> <span>Voice Call</span>
                    </button>
                </div>
                
                <button id="btn-connect-chat" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 py-2.5 text-xs font-bold text-white transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-comments"></i> <span>Start Chat</span>
                </button>

                <p id="connection-status" class="text-[11px] text-amber-500 font-mono">Initializing PeerJS...</p>
            </div>
        </section>

        <!-- CENTER DISPLAY -->
        <section class="lg:col-span-6 flex flex-col">
            <div class="relative glass-panel rounded-2xl overflow-hidden min-h-[380px] sm:min-h-[460px] flex items-center justify-center bg-slate-950">
                <video id="main-video" autoplay playsinline class="w-full h-full object-cover hidden no-mirror absolute inset-0"></video>
                <div id="group-video-grid" class="hidden absolute inset-0 w-full h-full p-2 grid gap-2 z-10 bg-slate-950"></div>

                <div id="remote-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
                    <div class="w-20 h-20 rounded-full bg-slate-800 border dynamic-border flex items-center justify-center mb-4 dynamic-text animate-pulse">
                        <i class="fa-solid fa-user text-3xl"></i>
                    </div>
                    <h3 class="font-bold text-slate-200">READY TO CONNECT</h3>
                    <p class="text-xs text-slate-400 mt-1">Select an online member or enter a Mobile Number to Chat or Call.</p>
                </div>

                <div id="pip-container" class="absolute bottom-16 right-4 w-32 h-44 rounded-xl overflow-hidden border-2 dynamic-border bg-slate-900 shadow-2xl z-20">
                    <video id="pip-video" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
                    <div id="pip-off-placeholder" class="absolute inset-0 flex items-center justify-center bg-slate-900 text-slate-500 text-xs font-mono">Camera Off</div>
                </div>

                <!-- CONTROLS BAR -->
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-slate-950/85 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-2xl z-30">
                    <button id="btn-toggle-mic" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition"><i class="fa-solid fa-microphone"></i></button>
                    <button id="btn-toggle-cam" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition"><i class="fa-solid fa-video"></i></button>
                    <button id="btn-end-call" class="w-10 h-10 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center transition"><i class="fa-solid fa-phone-slash"></i></button>
                </div>
            </div>
        </section>

        <!-- RIGHT TAB / MEMBERS DIRECTORY & CHAT -->
        <section class="lg:col-span-3 glass-panel rounded-2xl flex flex-col h-[480px] lg:h-auto overflow-hidden">
            <div class="grid grid-cols-2 bg-slate-900 border-b border-slate-800 text-xs font-bold">
                <button id="tab-chat-btn" class="py-2.5 text-center text-indigo-400 border-b-2 border-indigo-500 bg-slate-800/50">Chat</button>
                <button id="tab-members-btn" class="py-2.5 text-center text-slate-400 hover:text-slate-200">Members</button>
            </div>

            <!-- CHAT VIEW -->
            <div id="view-chat" class="flex-1 flex flex-col overflow-hidden p-2">
                <div id="chat-messages" class="flex-1 p-2 overflow-y-auto flex flex-col gap-2 text-xs font-mono">
                    <div class="text-slate-500 text-center py-4">-- CONNECT TO A FRIEND TO START CHATTING --</div>
                </div>
                <form id="chat-form" class="mt-2 flex gap-1.5">
                    <input id="chat-input" type="text" placeholder="Type message..." disabled class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs outline-none font-mono">
                    <button id="chat-send-btn" type="submit" disabled class="px-3 py-1.5 bg-indigo-600 text-white font-bold rounded-xl text-xs"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>

            <!-- MEMBERS VIEW -->
            <div id="view-members" class="hidden flex-1 p-3 flex flex-col gap-2 overflow-y-auto text-xs font-mono">
                <div class="flex justify-between items-center text-slate-400 mb-1">
                    <span>Active Online Users:</span>
                    <span id="online-counter" class="text-emerald-400 font-bold">1</span>
                </div>
                <div id="members-list-container" class="flex flex-col gap-2"></div>
            </div>
        </section>

    </main>

    <!-- INCOMING REQUEST MODAL -->
    <div id="request-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full rounded-2xl p-5 text-center flex flex-col items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-indigo-600/30 text-indigo-400 flex items-center justify-center text-xl"><i class="fa-solid fa-comments"></i></div>
            <h3 class="font-bold text-slate-200 text-sm">INCOMING CHAT REQUEST</h3>
            <p id="request-caller-id" class="text-xs text-cyan-400 font-mono">User: ...</p>
            <div class="flex gap-2 w-full mt-2">
                <button id="btn-reject-req" class="flex-1 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">DECLINE</button>
                <button id="btn-accept-req" class="flex-1 py-2 rounded-xl bg-emerald-600 text-xs font-bold text-white">ACCEPT</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="font-bold text-slate-200">SETTINGS</h3>
                <button id="close-settings-btn" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">YOUR MOBILE NUMBER</label>
                <input id="user-mobile-input" type="tel" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs">
            </div>
            <button id="save-settings-btn" class="w-full py-2.5 rounded-xl dynamic-bg-primary text-white text-xs font-bold">SAVE CHANGES</button>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        let peer = null, myPeerId = null, localStream = null;
        let activeDataConn = null;
        let activeCalls = new Map(), remoteStreamsMap = new Map();
        let pendingCallerId = null;

        let userMobile = localStorage.getItem('user_mobile') || ('9' + Math.floor(100000000 + Math.random() * 900000000));

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-mobile-input').value = userMobile;
            initPeer();
            setupUI();
            registerPresence();
        });

        function initPeer() {
            peer = new Peer(userMobile, { host: '0.peerjs.com', port: 443, secure: true });

            peer.on('open', id => {
                myPeerId = id;
                document.getElementById('my-peer-id').innerText = id;
                document.getElementById('connection-status').innerText = "Online";
                document.getElementById('connection-status').className = "text-[11px] text-emerald-400 font-mono";
            });

            peer.on('connection', conn => {
                pendingCallerId = conn.peer;
                document.getElementById('request-caller-id').innerText = `User ID: ${conn.peer}`;
                document.getElementById('request-modal').classList.remove('hidden');

                conn.on('open', () => {
                    activeDataConn = conn;
                    bindDataConnection(conn);
                });
            });

            peer.on('call', call => {
                if (confirm(`Incoming call from ${call.peer}. Answer?`)) {
                    getLocalStream(call.metadata && call.metadata.type === 'video').then(stream => {
                        call.answer(stream);
                        handleCallStream(call);
                    });
                }
            });
        }

        function bindDataConnection(conn) {
            document.getElementById('target-peer-id').value = conn.peer;
            document.getElementById('connection-status').innerText = `Connected: ${conn.peer}`;
            document.getElementById('chat-input').removeAttribute('disabled');
            document.getElementById('chat-send-btn').removeAttribute('disabled');

            conn.on('data', data => {
                appendChatMessage(`Friend (${conn.peer})`, data, false);
            });

            conn.on('close', () => {
                activeDataConn = null;
                document.getElementById('connection-status').innerText = "Online (Chat Closed)";
                document.getElementById('chat-input').setAttribute('disabled', 'true');
                document.getElementById('chat-send-btn').setAttribute('disabled', 'true');
            });
        }

        function registerPresence() {
            if (myPeerId) {
                const active = JSON.parse(localStorage.getItem('connect_online_peers') || '{}');
                active[myPeerId] = Date.now();
                localStorage.setItem('connect_online_peers', JSON.stringify(active));
            }
            renderMembersList();
        }

        function renderMembersList() {
            const container = document.getElementById('members-list-container');
            const active = JSON.parse(localStorage.getItem('connect_online_peers') || '{}');
            const now = Date.now();

            container.innerHTML = '';
            let count = 0;

            Object.keys(active).forEach(pId => {
                if (now - active[pId] > 20000) return; // ignore inactive >20s
                count++;

                const isSelf = (pId === myPeerId);
                const item = document.createElement('div');
                item.className = "p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between";
                item.innerHTML = `
                    <div class="truncate">
                        <span class="font-bold text-slate-200 block">${isSelf ? 'You' : 'User: ' + pId}</span>
                        <span class="text-[10px] text-slate-500">${pId}</span>
                    </div>
                    ${!isSelf ? `<button onclick="connectToPeer('${pId}')" class="px-2.5 py-1 rounded-lg dynamic-bg-primary text-white text-[10px] font-bold">Connect</button>` : '<span class="text-[10px] text-emerald-400 font-bold">Active</span>'}
                `;
                container.appendChild(item);
            });

            document.getElementById('online-counter').innerText = `${count} Online`;
        }

        setInterval(registerPresence, 5000);

        window.connectToPeer = (peerId) => {
            document.getElementById('target-peer-id').value = peerId;
            const conn = peer.connect(peerId);
            conn.on('open', () => {
                activeDataConn = conn;
                bindDataConnection(conn);
                alert(`Connected to ${peerId}! You can now chat or call directly.`);
            });
        };

        async function getLocalStream(enableVideo = true) {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ video: enableVideo, audio: true });
            }
            return localStream;
        }

        function handleCallStream(call) {
            activeCalls.set(call.peer, call);
            call.on('stream', stream => {
                remoteStreamsMap.set(call.peer, stream);
                renderVideoGrid();
            });
            call.on('close', () => {
                activeCalls.delete(call.peer);
                remoteStreamsMap.delete(call.peer);
                renderVideoGrid();
            });
        }

        function renderVideoGrid() {
            const mainVid = document.getElementById('main-video');
            const placeholder = document.getElementById('remote-placeholder');
            const activeIds = Array.from(remoteStreamsMap.keys());

            if (activeIds.length === 0) {
                mainVid.classList.add('hidden');
                placeholder.classList.remove('hidden');
                return;
            }

            placeholder.classList.add('hidden');
            mainVid.classList.remove('hidden');
            mainVid.srcObject = remoteStreamsMap.get(activeIds[0]);
            document.getElementById('pip-video').srcObject = localStream;
            document.getElementById('pip-video').classList.remove('hidden');
        }

        async function triggerCall(isVideo) {
            let target = document.getElementById('target-peer-id').value.trim();
            if (!target && activeDataConn) target = activeDataConn.peer;

            if (!target) return alert("Select an online member or enter a Mobile Number first.");

            const stream = await getLocalStream(isVideo);
            const call = peer.call(target, stream, { metadata: { type: isVideo ? 'video' : 'voice' } });
            handleCallStream(call);
        }

        function appendChatMessage(sender, text, isSelf) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;
            div.innerHTML = `<span class="text-[9px] text-slate-500 mb-0.5">${sender}</span><div class="px-3 py-1.5 rounded-xl max-w-[85%] break-words ${isSelf ? 'dynamic-bg-primary text-white' : 'bg-slate-800 text-slate-200'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function setupUI() {
            document.getElementById('btn-start-video').onclick = () => triggerCall(true);
            document.getElementById('btn-start-voice').onclick = () => triggerCall(false);

            document.getElementById('btn-connect-chat').onclick = () => {
                const target = document.getElementById('target-peer-id').value.trim();
                if (target) connectToPeer(target);
            };

            document.getElementById('chat-form').onsubmit = (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                const val = input.value.trim();
                if (val && activeDataConn) {
                    activeDataConn.send(val);
                    appendChatMessage("You", val, true);
                    input.value = '';
                }
            };

            document.getElementById('btn-accept-req').onclick = () => {
                document.getElementById('request-modal').classList.add('hidden');
                if (pendingCallerId) connectToPeer(pendingCallerId);
            };

            document.getElementById('btn-reject-req').onclick = () => {
                document.getElementById('request-modal').classList.add('hidden');
            };

            document.getElementById('btn-end-call').onclick = () => {
                activeCalls.forEach(c => c.close());
                activeCalls.clear(); remoteStreamsMap.clear();
                if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
                renderVideoGrid();
            };

            document.getElementById('tab-chat-btn').onclick = () => {
                document.getElementById('view-chat').classList.remove('hidden');
                document.getElementById('view-members').classList.add('hidden');
            };

            document.getElementById('tab-members-btn').onclick = () => {
                document.getElementById('view-members').classList.remove('hidden');
                document.getElementById('view-chat').classList.add('hidden');
            };

            document.getElementById('btn-show-settings').onclick = () => document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('close-settings-btn').onclick = () => document.getElementById('settings-modal').classList.add('hidden');

            document.getElementById('save-settings-btn').onclick = () => {
                const num = document.getElementById('user-mobile-input').value.trim();
                if (num) localStorage.setItem('user_mobile', num);
                document.getElementById('settings-modal').classList.add('hidden');
                location.reload();
            };
        }
    </script>
</body>
</html>
